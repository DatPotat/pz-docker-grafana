global:
  scrape_interval: 15s

scrape_configs:
  - job_name: zomboid
    static_configs:
      - targets: ["rcon-exporter:9115"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9116"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]